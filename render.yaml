services:
  - type: web
    name: rig-query-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python setup_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./rig_query.db
      - key: PDF_OUTPUT_DIR
        value: ./generated_pdfs
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
